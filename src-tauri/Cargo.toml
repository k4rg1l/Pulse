[package]
name = "pulse"
version = "0.1.1"
description = "Everything you care about, in one tray app"
authors = ["Vatsal Jain"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pulse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sysinfo = { version = "0.40.1", default-features = false, features = ["system", "disk", "network"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
tokio = { version = "1.54.1", features = ["sync", "time", "macros", "rt", "process", "io-util"] }
async-trait = "0.1.92"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
keyring-core = "1.0.1"
windows-native-keyring-store = "1.1.0"
nvml-wrapper = "0.13.0"
time = { version = "0.3.55", features = ["parsing", "formatting", "local-offset"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

